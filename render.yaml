services:
  - type: web
    name: cohort-compass
    runtime: node
    repo: https://github.com/itspaigenli/cohort-compass
    branch: main
    plan: free
    buildCommand: npm install --prefix server && npm run build --prefix server
    startCommand: npm start --prefix server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: GOOGLE_CALENDAR_ID
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: GOOGLE_CALENDAR_TIMEZONE
        value: America/Los_Angeles
      - key: GOOGLE_CALENDAR_LOOKAHEAD_DAYS
        value: "30"
      - key: GOOGLE_CALENDAR_MAX_RESULTS
        value: "100"
